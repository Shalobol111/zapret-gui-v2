name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check version matches tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($conf -ne $tag) { throw "Тег $tag не совпадает с версией в tauri.conf.json ($conf)" }

      - name: Build
        run: |
          npm ci
          npx tauri build

      - name: Collect files and checksums
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory out | Out-Null
          Copy-Item src-tauri/target/release/zapret-gui.exe "out/ZapretGUI_${v}_portable.exe"
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Get-ChildItem out | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content out/SHA256SUMS.txt -Encoding utf8

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/*
